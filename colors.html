<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bảng màu</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main class="wrap"><h1>Bảng màu tham khảo</h1><div id="list" class="grid"></div></main><div id="footer"></div><script src="app.js"></script><script>(async()=>{let d=await loadData();nav.innerHTML=nav(d);footer.innerHTML=footer(d);list.innerHTML=d.colors.map(c=>`<div class="card"><div class="color-box" style="background:${escapeHtml(c.hex)}"></div><h3>${escapeHtml(c.name)}</h3><p class="muted">${escapeHtml(c.hex)}</p></div>`).join("")})()</script></body></html>
