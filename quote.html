<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Báo giá</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main class="wrap"><h1>Nhận báo giá</h1><div class="notice">Biểu mẫu hiện gửi bằng ứng dụng email của thiết bị. Khi bạn cung cấp số điện thoại/email thực tế, mình có thể cấu hình tiếp kênh nhận yêu cầu.</div><form class="form" id="f"><input name="name" placeholder="Họ tên" required><input name="phone" placeholder="Số điện thoại" required><select name="type"><option>Nhà phố</option><option>Biệt thự</option><option>Căn hộ</option><option>Khác</option></select><input name="area" placeholder="Diện tích m²"><textarea name="note" placeholder="Yêu cầu"></textarea><button class="btn">Gửi yêu cầu</button></form></main><div id="footer"></div><script src="app.js"></script><script>(async()=>{let d=await loadData();nav.innerHTML=nav(d);footer.innerHTML=footer(d);f.onsubmit=e=>{e.preventDefault();let x=new FormData(f),body=`Họ tên: ${x.get("name")}%0D%0ASĐT: ${x.get("phone")}%0D%0ALoại: ${x.get("type")}%0D%0ADiện tích: ${x.get("area")}%0D%0AYêu cầu: ${x.get("note")}`;if(d.phone)location.href=`tel:${d.phone}`;else alert("Đã ghi nhận trên máy. Hãy cấu hình kênh nhận yêu cầu trong Quản trị.")}})()</script></body></html>
