<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sơn Nhà Đẹp Hoàn Nguyễn</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><section class="hero"><div class="hero-inner"><div><h1 id="heroTitle"></h1><p id="heroText"></p><a class="btn" href="quote.html">Báo giá ngay</a><a class="btn alt" href="projects.html">Xem công trình</a></div><img src="assets/logo.png"></div></section><main class="wrap"><h2>Dịch vụ nổi bật</h2><div class="grid"><div class="card"><div class="icon">🎨</div><h3>Sơn nội thất</h3><p class="muted">Tư vấn màu sắc và giải pháp phù hợp.</p></div><div class="card"><div class="icon">🏠</div><h3>Sơn ngoại thất</h3><p class="muted">Giải pháp hoàn thiện cho nhà phố, biệt thự.</p></div><div class="card"><div class="icon">🛡️</div><h3>Chống thấm</h3><p class="muted">Khảo sát và thi công theo hiện trạng.</p></div><div class="card"><div class="icon">🧰</div><h3>Thi công trọn gói</h3><p class="muted">Từ khảo sát, báo giá đến bàn giao.</p></div></div><h2 style="margin-top:38px">Sản phẩm nổi bật</h2><div id="products" class="grid"></div></main><div id="footer"></div><script src="app.js"></script><script>(async()=>{let d=await loadData();nav.innerHTML=nav(d);footer.innerHTML=footer(d);heroTitle.textContent=d.heroTitle;heroText.textContent=d.heroText;products.innerHTML=d.products.slice(0,4).map(p=>`<div class="card">${imgOrPlaceholder(p.image,p.name)}<h3>${escapeHtml(p.name)}</h3><p class="muted">${escapeHtml(p.category)}</p></div>`).join("")})()</script></body></html>
