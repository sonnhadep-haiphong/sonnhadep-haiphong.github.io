<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liên hệ</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main class="wrap"><h1>Liên hệ</h1><div class="card"><p>📍 <span id="address"></span></p><p id="phoneRow"></p><p id="zaloRow"></p><p id="fbRow"></p></div></main><div id="footer"></div><script src="app.js"></script><script>(async()=>{let d=await loadData();nav.innerHTML=nav(d);footer.innerHTML=footer(d);address.textContent=d.address;phoneRow.innerHTML=d.phone?`📞 <a href="tel:${escapeHtml(d.phone)}">${escapeHtml(d.phone)}</a>`:"📞 Chưa cập nhật số điện thoại";zaloRow.innerHTML=d.zalo?`💬 <a href="${escapeHtml(d.zalo)}" target="_blank">Zalo</a>`:"";fbRow.innerHTML=d.facebook?`🌐 <a href="${escapeHtml(d.facebook)}" target="_blank">Facebook</a>`:""})()</script></body></html>
