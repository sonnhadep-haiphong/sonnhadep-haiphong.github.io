<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sản phẩm</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main class="wrap"><h1>Catalog sản phẩm</h1><input id="q" placeholder="Tìm sản phẩm..." style="width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;margin:10px 0 20px"><div id="list" class="grid"></div></main><div id="footer"></div><script src="app.js"></script><script>(async()=>{let d=await loadData();nav.innerHTML=nav(d);footer.innerHTML=footer(d);function render(){let q=document.getElementById("q").value.toLowerCase();list.innerHTML=d.products.filter(p=>(p.name+p.category+p.description).toLowerCase().includes(q)).map(p=>`<div class="card">${imgOrPlaceholder(p.image,p.name)}<h3>${escapeHtml(p.name)}</h3><p><b>${escapeHtml(p.category)}</b></p><p class="muted">${escapeHtml(p.description)}</p></div>`).join("")}q.oninput=render;render()})()</script></body></html>
