<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Công trình</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main class="wrap"><h1>Công trình tiêu biểu</h1><div id="list" class="grid"></div></main><div id="footer"></div><script src="app.js"></script><script>(async()=>{let d=await loadData();nav.innerHTML=nav(d);footer.innerHTML=footer(d);list.innerHTML=d.projects.map(p=>`<div class="card"><div class="row"><div>${p.before?`<img class="project-img" src="${escapeHtml(p.before)}">`:`<div class="project-img"></div>`}<p class="small muted">Trước</p></div><div>${p.after?`<img class="project-img" src="${escapeHtml(p.after)}">`:`<div class="project-img"></div>`}<p class="small muted">Sau</p></div></div><h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.location)}</p><p class="muted">${escapeHtml(p.description)}</p></div>`).join("")})()</script></body></html>
